[package]
name = "framecorder-app"
version = "0.1.1"
edition = "2021"
description = "framecorder's sync client, shared by the desktop and Android apps"
license = "MIT"
default-run = "framecorder-app"

[lib]
name = "framecorder_app_lib"

[[bin]]
name = "framecorder-app"
path = "src/main.rs"

[dependencies]
bytes = "1"
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
if-addrs = "0.15"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
mdns-sd = { version = "0.21", default-features = false, features = ["async"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots-no-provider", "stream", "json"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util", "net"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
