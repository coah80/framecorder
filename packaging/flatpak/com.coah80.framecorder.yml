# framecorder as a flatpak, for installing straight from the headset's browser.
# it carries the same release the frame drop zip does and installs it outside
# the sandbox (see framecorder-installer.sh for why). built by
# .github/workflows/flatpak.yml, which drops framecorder-arm64.zip and the app
# icon (app/icons/icon.png) next to this first.
id: com.coah80.framecorder
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: framecorder-installer
finish-args:
  # runs the installer on the headset itself
  - --talk-name=org.freedesktop.Flatpak
  # where the installer is handed over
  - --filesystem=~/.local/share/framecorder:create
modules:
  - name: framecorder
    buildsystem: simple
    build-commands:
      - install -Dm755 framecorder /app/share/framecorder/framecorder-setup
      - install -Dm644 payload.tar /app/share/framecorder/payload.tar
      - install -Dm755 framecorder-installer.sh /app/bin/framecorder-installer
      - install -Dm644 com.coah80.framecorder.desktop /app/share/applications/com.coah80.framecorder.desktop
      - install -Dm644 com.coah80.framecorder.metainfo.xml /app/share/metainfo/com.coah80.framecorder.metainfo.xml
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/com.coah80.framecorder.png
    sources:
      - type: archive
        path: framecorder-arm64.zip
        strip-components: 0
      - type: file
        path: framecorder-installer.sh
      - type: file
        path: com.coah80.framecorder.desktop
      - type: file
        path: com.coah80.framecorder.metainfo.xml
      - type: file
        path: icon.png
