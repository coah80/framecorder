[package]
name = "framecorder-stats"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Counts framecorder's anonymous daily pings and discord link visits, and shows them on a locked dashboard"

[dependencies]
anyhow = "1"
httparse = "1"
ring = "0.17"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
