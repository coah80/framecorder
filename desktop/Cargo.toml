[package]
name = "framecorder-desktop"
version = "0.1.1"
edition = "2021"
description = "framecorder's desktop app, native on gpui-ce"
license = "MIT"

[[bin]]
name = "framecorder-desktop"
path = "src/main.rs"

[dependencies]
# the sync core, without any of tauri
framecorder-app = { path = "../app", default-features = false }

gpui = { package = "gpui-ce", version = "0.2.2" }
gpui_platform = { package = "gpui_ce_platform", version = "0.1.0", features = ["wayland", "x11", "font-kit"] }

async-channel = "2"
auto-launch = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
log = "0.4"
self-replace = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
ureq = { version = "3", features = ["json", "platform-verifier"] }
tray-icon = { version = "0.26.0", default-features = false, features = ["ksni"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }

# the app icon in the windows exe, see build.rs
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
