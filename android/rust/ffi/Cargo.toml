[package]
name = "framecorder-ffi"
version = "0.2.0"
edition = "2021"
description = "framecorder's sync core for the Android app, over UniFFI"
license = "MIT"
publish = false

[lib]
name = "framecorder_ffi"
crate-type = ["cdylib", "lib"]

[dependencies]
# the same sync core the desktop app runs, without any of Tauri
framecorder-app = { path = "../../../app", default-features = false }
log = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
uniffi = "0.32"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = { version = "0.15", default-features = false }
