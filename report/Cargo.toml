[package]
name = "framecorder-report"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Accepts public issue reports for framecorder"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
httparse = "1"
regex = "1"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"], default-features = false }
url = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
