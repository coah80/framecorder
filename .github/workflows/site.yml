# puts site/ on github pages whenever it changes on main, or a release comes out.
# the headset release gets served from here too, so the installer's
# one url (framecorder.coah80.com/install) always gets the latest
name: site

on:
  push:
    branches: [main]
    paths: ["site/**", "installer/**", ".github/workflows/site.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # the dev builds are a prerelease, they're not for the site
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: the headset release, from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/dl
          for file in framecorder-arm64.tar.gz framecorder-arm64.tar.gz.sha256; do
            gh release download --repo "${{ github.repository }}" --pattern "$file" --dir site/dl
            test -s "site/dl/$file"
          done
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: the installer site/install downloads
        run: installer/build.sh site/dl
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4