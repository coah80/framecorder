# puts site/ on github pages whenever it changes on main, or a release comes out.
# the headset release gets served from here too, so the installer's
# one url (framecorder.coah80.com/install) always gets the latest
name: site

on:
  push:
    branches: [main]
    paths: ["site/**", "installer/**", ".github/workflows/site.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # the dev builds are a prerelease, they're not for the site
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: the headset release, from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/dl
          for file in framecorder-arm64.tar.gz framecorder-arm64.tar.gz.sha256; do
            gh release download --repo "${{ github.repository }}" --pattern "$file" --dir site/dl \
              || echo "no $file on the latest release yet"
          done
      - uses: oven-sh/setup-bun@v2
      - name: the installer site/install downloads
        run: installer/build.sh site/dl
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
