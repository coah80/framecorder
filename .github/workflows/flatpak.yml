# builds the headset flatpak (packaging/flatpak) from the release's headset zip
# and attaches framecorder.flatpak to that release. the site workflow runs when
# this finishes and serves it at /dl, where the site links to it.
name: flatpak

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: release to build for (defaults to the latest)
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: which release
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(curl -fsSL https://api.github.com/repos/${{ github.repository }}/releases/latest | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -n1)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "building for $TAG"
      - name: the headset zip and the icon, next to the manifest
        run: |
          curl -fsSL -o packaging/flatpak/framecorder-arm64.zip \
            "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/framecorder-arm64.zip"
          cp app/icons/icon.png packaging/flatpak/icon.png
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.coah80.framecorder.yml
          bundle: framecorder.flatpak
          arch: aarch64
          cache: false
          upload-artifact: true
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo, tag, token = os.environ["REPO"], os.environ["TAG"], os.environ["GH_TOKEN"]
          def call(url, method="GET", data=None, kind="application/json"):
              req = urllib.request.Request(url, data=data, method=method, headers={
                  "Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "Content-Type": kind})
              with urllib.request.urlopen(req) as r:
                  body = r.read()
                  return json.loads(body) if body else None
          release = call(f"https://api.github.com/repos/{repo}/releases/tags/{tag}")
          for asset in release["assets"]:
              if asset["name"] == "framecorder.flatpak":
                  call(f"https://api.github.com/repos/{repo}/releases/assets/{asset['id']}", "DELETE")
          with open("framecorder.flatpak", "rb") as f:
              call(f"https://uploads.github.com/repos/{repo}/releases/{release['id']}/assets?name=framecorder.flatpak",
                   "POST", f.read(), "application/octet-stream")
          print(f"attached framecorder.flatpak to {tag}")
          PY
