# builds the desktop app for macos, windows and linux. push a tag like v0.1.0
# and they land on that tag's release, named how the website links to them.
# android is built and signed locally, see android/README.md
name: app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# builds only read the repo. the release job below is the one that writes
permissions:
  contents: read

jobs:
  # the desktop app (desktop/, gpui-ce): an AppImage on linux, an installer on
  # windows and a dmg on macos, named what the site links and its self updater
  # looks for
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            file: framecorder-desktop-macos.dmg
          - os: windows-latest
            file: framecorder-setup.exe
          - os: ubuntu-22.04
            file: framecorder-x86_64.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop

      - name: linux build deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev libfreetype-dev libwayland-dev libxcb1-dev libasound2-dev nasm

      # the live preview test decodes a real stream with the ffmpeg cli, like the app does
      - uses: FedericoCarboni/setup-ffmpeg@36c6454b5a2348e7794ba2d82a21506605921e3d # v3
        if: ${{ !startsWith(matrix.os, 'macos') }}
      # that action only has x64 builds, the mac runners are arm
      - name: ffmpeg (macos)
        if: startsWith(matrix.os, 'macos')
        run: brew install ffmpeg

      - name: test
        run: cargo test --release

      # the small ffmpeg the app ships next to itself for thumbnails and the
      # live picture (see ffmpeg.sh), built once per version of that script
      - id: ffcache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ffmpeg-bin
          key: ffmpeg-${{ matrix.os }}-${{ hashFiles('desktop/ffmpeg.sh', 'packaging/ffmpeg.sh') }}
      - name: ffmpeg for the app (linux)
        if: startsWith(matrix.os, 'ubuntu') && steps.ffcache.outputs.cache-hit != 'true'
        run: ./ffmpeg.sh ../ffmpeg-bin
      - name: ffmpeg for the app (macos)
        if: startsWith(matrix.os, 'macos') && steps.ffcache.outputs.cache-hit != 'true'
        run: |
          brew install nasm
          ./ffmpeg.sh ../ffmpeg-bin/arm64
          ./ffmpeg.sh ../ffmpeg-bin/x86_64 x86_64
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        if: startsWith(matrix.os, 'windows') && steps.ffcache.outputs.cache-hit != 'true'
        with:
          msystem: UCRT64
          install: make diffutils curl tar mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-nasm
      - name: ffmpeg for the app (windows)
        if: startsWith(matrix.os, 'windows') && steps.ffcache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: ./ffmpeg.sh ../ffmpeg-bin

      # an AppImage, built on the oldest ubuntu ci has so it runs on most
      # distros. linuxdeploy bundles the libraries a distro might not have and
      # leaves out the ones that must come from the system (glibc, the gpu
      # driver, fontconfig). xkbcommon comes from the system too: an older one
      # can't read a newer distro's keyboard files, and every desktop has it.
      # appimagetool's runtime doesn't need libfuse2
      - name: build (linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          cargo build --release
          curl -fsSLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl -fsSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy appimagetool
          ./linuxdeploy --appimage-extract-and-run --appdir AppDir \
            --executable target/release/framecorder-desktop \
            --desktop-file linux/com.framecorder.desktop.desktop \
            --icon-file ../assets/icons/128x128@2x.png --icon-filename framecorder \
            --exclude-library 'libxkbcommon*' --exclude-library 'libxcb-xkb*'
          install -m755 ../ffmpeg-bin/ffmpeg AppDir/usr/bin/ffmpeg
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "../${{ matrix.file }}"

      # windows gets an installer, see windows/installer.iss
      - name: build (windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          cargo build --release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          & $iscc /Q "/DVersion=$version" "/DExe=$PWD\target\release\framecorder-desktop.exe" "/DFfmpeg=$PWD\..\ffmpeg-bin\ffmpeg.exe" "/DOutDir=$PWD\.." windows\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # a mac app has to be a bundle: one binary for apple silicon and intel,
      # the Info.plist (macos won't let it find the frame without its local
      # network keys) and the icon, ad-hoc signed, in a dmg
      - name: build (macos)
        if: startsWith(matrix.os, 'macos')
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          app=dmg/framecorder.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/framecorder-desktop" \
            target/aarch64-apple-darwin/release/framecorder-desktop target/x86_64-apple-darwin/release/framecorder-desktop
          lipo -create -output "$app/Contents/MacOS/ffmpeg" ../ffmpeg-bin/arm64/ffmpeg ../ffmpeg-bin/x86_64/ffmpeg
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          sed "s/VERSION/$version/g" macos/Info.plist > "$app/Contents/Info.plist"
          cp ../assets/icons/icon.icns "$app/Contents/Resources/icon.icns"
          codesign --force --deep --sign - "$app"
          # the dmg opens on a drag-to-applications window (macos/dmg.py)
          tiffutil -cathidpicheck macos/dmg-background.png macos/dmg-background@2x.png -out dmg-background.tiff
          pipx run --spec dmgbuild==1.6.7 dmgbuild -s macos/dmg.py -D app="$app" -D background=dmg-background.tiff \
            -D icon=../assets/icons/icon.icns framecorder "../${{ matrix.file }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: put them on the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes ""
          gh release upload "$TAG" dist/* --clobber
