name: Feature request
description: Suggest a new feature or setting for Framecorder
title: "[Feature Request] "
labels: ["feature request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please check existing issues first so we don't get duplicates.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way today.
      placeholder: "I'd like to record to my microSD card, but..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the feature or setting, and how you'd expect it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Anything you've tried instead, or other ways this could work.
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Screenshots, mockups, device or game details, or anything else that helps.
